name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# 같은 ref에 새 푸시가 오면 진행 중인 실행을 취소(CI 분 절약, 빠른 피드백).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 전체 게이트: 로컬 `pnpm verify`와 동일한 단일 명령으로 실행(정의 중복 제거).
  # ESLint/Vitest 툴체인이 Node 20+를 요구하므로 20/22/24에서 실행.
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # 최소 지원 런타임(Node 18) 호환 검증: 빌드 + 런타임 smoke만 실행.
  # (ESLint/Vitest는 Node 18을 지원하지 않으므로 게이트에서 제외)
  compat-node18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm smoke
