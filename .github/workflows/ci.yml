name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# 같은 ref에 새 푸시가 오면 진행 중인 실행을 취소(CI 분 절약, 빠른 피드백).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 전체 게이트: 로컬 `pnpm verify`와 동일한 단일 명령으로 실행(정의 중복 제거).
  # 지원 정책은 활성 LTS/Current 기준(Node 22 LTS, 24 LTS, 26 Current).
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
